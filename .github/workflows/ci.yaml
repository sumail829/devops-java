on:
  push:
    branches:
      - main


jobs:
  Build-JAVA-Artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello gihub actions"
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with gradle
        run: ./gradlew build
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: calculator.jar
          path: build/libs/*.jar
          retention-days: 1
  deploy-on-aws:
      needs: Build-JAVA-Artifacts
      runs-on: ubuntu-latest
      steps:
        - name: Download a Build  Artifacts
          uses: actions/download-artifact@v7.0.0
          with:
            name: calculator.jar
            path: jar
        - name: list contents of current folder
          run: |
            ls -al
            ls -al jar
        - name: copy content
          run: echo "${{secrets.SSH_KEY}}" > devops-tos.pem
        - name: give permission
          run: cat devops-tos.pem && chmod 400 devops-tos.pem
        - name: login to ssh server
          run: | 
               ssh -o StrictHostKeyChecking=no -i devops-tos.pem ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }} << 'ENDSSH'
               if [ ! -d  /home/ubuntu/suman ]; then
                   mkdir /home/ubuntu/suman
               fi
               ENDSSH
        - name: copy jar folder to aws servver
          run: scp -i devops-tos.pem -rv jar/* ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }}:/home/ubuntu/suman 
        - name: Running the java application
          run: |
               ssh -o StrictHostKeyChecking=no -i devops-tos.pem ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }} << 'ENDSSH'
               sudo fuser -k 8060/tcp || true
               nohup java -jar /var/www/html/suman/calculator-1.0.0.jar > app.log 2>&1 &
               disown
               ENDSSH








