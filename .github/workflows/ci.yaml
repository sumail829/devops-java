on:
  push:
    branches:
      - main


jobs:
  Build-JAVA-Artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello gihub actions"
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with gradle
        run: ./gradlew build
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: calculator.jar
          path: build/libs/*.jar
          retention-days: 1
  deploy-on-aws:
      needs: Build-JAVA-Artifacts
      runs-on: ubuntu-latest
      steps:
        - name: Download a Build  Artifacts
          uses: actions/download-artifact@v7.0.0
          with:
            name: calculator.jar
            path: jar
        - name: list contents of current folder
          run: |
            ls -al
            ls -al jar





