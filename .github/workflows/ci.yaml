on:
  push:
    branches:
      - main


jobs:
  Build-JAVA-Artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello gihub actions"
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 17
